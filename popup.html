<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMABA - Autonomous Agent Extension</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;450&display=swap"
    rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Geist';
      src: local('Geist'), local('Inter');
      font-weight: 500 600 700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --surface: #131313;
      --surface-container-low: #1c1b1b;
      --surface-container: #201f1f;
      --surface-container-high: #2a2a2a;
      --surface-container-highest: #353534;
      --on-surface: #e5e2e1;
      --on-surface-variant: #bcc8d1;
      --outline: #87929b;
      --outline-variant: #3d4850;
      --surface-tint: #7ad0ff;
      --primary: #8fd6ff;
      --on-primary: #003549;
      --primary-container: #00bfff;
      --secondary: #11ffa0;
      --on-secondary: #00391f;
      --tertiary: #ffc452;
      --error: #ffb4ab;
      --background: #0a0a0a;
    }

    body {
      width: 400px;
      min-height: 560px;
      background: var(--background);
      color: var(--on-surface);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      z-index: 0;
    }

    .extension-container {
      position: relative;
      z-index: 1;
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(19, 19, 19, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo { width: 32px; height: 32px; position: relative; }

    .brand-name {
      font-family: 'Geist', 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--on-surface);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(17, 255, 160, 0.1);
      border: 1px solid rgba(17, 255, 160, 0.3);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--secondary);
      transition: all 0.3s ease;
    }

    .status-badge.active {
      background: rgba(0, 191, 255, 0.12);
      border-color: rgba(0, 191, 255, 0.4);
      color: var(--primary);
    }

    .status-badge.error {
      background: rgba(255, 180, 171, 0.12);
      border-color: rgba(255, 180, 171, 0.4);
      color: var(--error);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      position: relative;
    }

    .status-dot.active::after {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0;
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }

    /* ── Main Content ─────────────────────────────────────────── */
    .main-content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hidden { display: none !important; }

    /* ── Input Section ────────────────────────────────────────── */
    .input-container {
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.3s ease;
    }

    .input-container:focus-within {
      border-color: rgba(0, 191, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.1);
    }

    .input-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--on-surface);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      resize: none;
    }

    .input-field::placeholder { color: rgba(229, 226, 225, 0.4); }

    .input-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
      gap: 8px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--primary-container);
      color: var(--on-primary);
      border: none;
      border-radius: 9999px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px rgba(0, 191, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-primary .material-icons { font-size: 18px; }

    /* ── Suggestions ──────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      margin-bottom: 4px;
    }

    .suggestion-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggestion-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(28, 27, 27, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .suggestion-card:hover {
      border-color: rgba(0, 191, 255, 0.4);
      background: rgba(32, 31, 31, 0.9);
      transform: translateX(4px);
    }

    .suggestion-icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(143, 214, 255, 0.1);
      border-radius: 10px;
      color: var(--primary);
    }
    .suggestion-icon .material-icons { font-size: 20px; }

    .suggestion-text { font-size: 14px; font-weight: 500; color: var(--on-surface); }

    .suggestion-arrow {
      margin-left: auto;
      color: var(--outline);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .suggestion-card:hover .suggestion-arrow { opacity: 1; }

    /* ── Workflow ──────────────────────────────────────────────── */
    .workflow-section {
      background: rgba(28, 27, 27, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
    }

    .workflow-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .workflow-list { display: flex; flex-direction: column; gap: 10px; }

    .workflow-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }
    .workflow-item:not(:last-child) { border-bottom: 1px solid rgba(255, 255, 255, 0.04); }

    .workflow-status {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .workflow-status .material-icons { font-size: 16px; }
    .workflow-status.completed { color: var(--secondary); }
    .workflow-status.active { color: var(--primary); position: relative; }
    .workflow-status.active::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0;
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .workflow-status.pending { color: var(--outline); }

    .workflow-info { flex: 1; min-width: 0; }
    .workflow-name {
      font-size: 13px; font-weight: 500; color: var(--on-surface);
      display: flex; align-items: center; gap: 6px;
    }
    .workflow-action {
      font-size: 12px; color: var(--on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .workflow-tag {
      font-size: 10px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .workflow-tag.completed { background: rgba(17, 255, 160, 0.15); color: var(--secondary); }
    .workflow-tag.active    { background: rgba(0, 191, 255, 0.15); color: var(--primary); }
    .workflow-tag.pending   { background: rgba(135, 146, 155, 0.15); color: var(--outline); }

    /* ── Logs ─────────────────────────────────────────────────── */
    .logs-section {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      overflow: hidden;
    }
    .logs-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .logs-header .material-icons { font-size: 14px; color: var(--primary); }
    .logs-title {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--on-surface-variant);
    }
    .logs-auto-scroll {
      margin-left: auto;
      font-size: 11px;
      color: var(--outline);
      cursor: pointer;
    }
    .logs-auto-scroll:hover { color: var(--on-surface-variant); }

    .logs-content {
      padding: 12px 16px;
      max-height: 160px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    .logs-content::-webkit-scrollbar { width: 4px; }
    .logs-content::-webkit-scrollbar-track { background: transparent; }
    .logs-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }

    .log-entry {
      display: flex; align-items: flex-start; gap: 8px;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeIn 0.3s ease forwards;
    }
    .log-entry:last-child { margin-bottom: 0; }

    @keyframes fadeIn { to { opacity: 1; } }

    .log-timestamp { color: rgba(255, 255, 255, 0.3); white-space: nowrap; flex-shrink: 0; }
    .log-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .log-dot.info    { background: var(--primary); }
    .log-dot.success { background: var(--secondary); }
    .log-dot.error   { background: var(--error); }
    .log-message { color: rgba(229, 226, 225, 0.7); word-break: break-word; }

    /* ── Bottom Controls ──────────────────────────────────────── */
    .bottom-controls {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      background: rgba(19, 19, 19, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky; bottom: 0;
    }
    .control-buttons { display: flex; gap: 8px; }

    .btn-ghost {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      color: var(--on-surface);
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.3); }
    .btn-ghost.abort:hover { border-color: rgba(255, 180, 171, 0.5); color: var(--error); }
    .btn-ghost .material-icons { font-size: 16px; }

    .shortcut-hint {
      font-size: 11px; color: var(--outline);
      display: flex; align-items: center; gap: 4px;
    }
    .kbd {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--on-surface-variant);
    }

    /* ── Status bar ───────────────────────────────────────────── */
    .status-message {
      text-align: center; padding: 8px;
      font-size: 12px; color: var(--secondary);
      letter-spacing: 0.02em;
    }
    .status-message .material-icons { font-size: 14px; vertical-align: middle; margin-right: 4px; }

    .logo-svg { width: 32px; height: 32px; }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    .breathing { animation: breathe 2s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; }

    /* ── Settings gear ────────────────────────────────────────── */
    .settings-gear {
      background: none; border: none; cursor: pointer;
      color: var(--outline); padding: 4px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .settings-gear:hover { color: var(--on-surface); background: rgba(255,255,255,0.06); }
    .settings-gear .material-icons { font-size: 18px; }
  </style>
</head>

<body>
  <div class="extension-container">

    <!-- ── Header ──────────────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="36" height="36" rx="8" stroke="url(#gradient1)" stroke-width="2" fill="none" />
            <path d="M20 10L28 26H12L20 10Z" stroke="var(--primary-container)" stroke-width="1.5" fill="none" />
            <circle cx="20" cy="20" r="2" fill="var(--primary)" />
            <defs>
              <linearGradient id="gradient1" x1="0" y1="0" x2="40" y2="40">
                <stop offset="0%" stop-color="var(--secondary)" />
                <stop offset="100%" stop-color="var(--primary-container)" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">AMABA</span>
      </div>
      <div id="status-badge" class="status-badge">
        <span id="status-dot" class="status-dot active"></span>
        <span id="status-text">READY</span>
      </div>
    </header>

    <main class="main-content">

      <!-- ═══ READY VIEW ═══════════════════════════════════ -->
      <div id="ready-view">
        <section class="input-section">
          <div class="input-container">
            <textarea id="input-field" class="input-field" rows="3"
              placeholder="Describe your goal...&#10;Example: Find top 10 AI startup founders on LinkedIn"></textarea>
            <div class="input-actions">
              <button id="start-btn" class="btn-primary">
                <span class="material-icons">auto_awesome</span>
                Start Automation
              </button>
            </div>
          </div>
        </section>

        <section class="suggestions-section">
          <div class="section-label">Suggested Actions</div>
          <div class="suggestion-cards">
            <div class="suggestion-card">
              <div class="suggestion-icon">
                <span class="material-icons">search</span>
              </div>
              <span class="suggestion-text">Research competitors</span>
              <span class="material-icons suggestion-arrow">chevron_right</span>
            </div>
            <div class="suggestion-card">
              <div class="suggestion-icon">
                <span class="material-icons">compare_arrows</span>
              </div>
              <span class="suggestion-text">Compare products</span>
              <span class="material-icons suggestion-arrow">chevron_right</span>
            </div>
            <div class="suggestion-card">
              <div class="suggestion-icon">
                <span class="material-icons">description</span>
              </div>
              <span class="suggestion-text">Fill form</span>
              <span class="material-icons suggestion-arrow">chevron_right</span>
            </div>
          </div>
        </section>
      </div>

      <!-- ═══ ACTIVE VIEW ══════════════════════════════════ -->
      <div id="active-view" class="hidden">

        <section class="workflow-section">
          <div class="workflow-header">
            <div class="section-label">Active Workflow</div>
          </div>
          <div id="workflow-list" class="workflow-list">
            <!-- Dynamically populated by popup.js -->
          </div>
        </section>

        <section class="logs-section">
          <div class="logs-header">
            <span class="material-icons">terminal</span>
            <span class="logs-title">Live Logs</span>
            <span class="logs-auto-scroll">Auto-scroll</span>
          </div>
          <div class="logs-content" id="logsContainer">
            <!-- Dynamically populated by popup.js -->
          </div>
        </section>

      </div>

    </main>

    <!-- ── Bottom Controls ─────────────────────────────────── -->
    <footer class="bottom-controls">
      <div class="control-buttons">
        <button id="pause-btn" class="btn-ghost">
          <span class="material-icons">pause</span>
          Pause
        </button>
        <button id="abort-btn" class="btn-ghost abort">
          <span class="material-icons">stop</span>
          Abort
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="shortcut-hint">
          <span class="kbd">Ctrl</span>
          <span class="kbd">Enter</span>
        </div>
        <button id="settings-btn" class="settings-gear" title="Settings">
          <span class="material-icons">settings</span>
        </button>
      </div>
    </footer>

    <div id="status-message" class="status-message">
      <span class="material-icons breathing">smart_toy</span>
      Agent ready to work
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
