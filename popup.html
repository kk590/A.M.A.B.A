<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMABA - Autonomous Agent Extension</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;450&display=swap"
    rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Geist';
      src: local('Geist'), local('Inter');
      font-weight: 500 600 700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --surface: #131313;
      --surface-container-low: #1c1b1b;
      --surface-container: #201f1f;
      --surface-container-high: #2a2a2a;
      --surface-container-highest: #353534;
      --on-surface: #e5e2e1;
      --on-surface-variant: #bcc8d1;
      --outline: #87929b;
      --outline-variant: #3d4850;
      --surface-tint: #7ad0ff;
      --primary: #8fd6ff;
      --on-primary: #003549;
      --primary-container: #00bfff;
      --secondary: #11ffa0;
      --on-secondary: #00391f;
      --tertiary: #ffc452;
      --error: #ffb4ab;
      --background: #0a0a0a;
    }

    body {
      width: 400px;
      min-height: 540px;
      background: var(--background);
      color: var(--on-surface);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none; z-index: 0;
    }

    .ext { position: relative; z-index: 1; min-height: 540px; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: rgba(19,19,19,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-svg { width: 28px; height: 28px; }
    .brand { font-family: 'Geist','Inter',sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }

    .badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .badge.ready  { background: rgba(17,255,160,0.1); border: 1px solid rgba(17,255,160,0.3); color: var(--secondary); }
    .badge.active { background: rgba(0,191,255,0.12); border: 1px solid rgba(0,191,255,0.4); color: var(--primary); }
    .badge.off    { background: rgba(255,180,171,0.12); border: 1px solid rgba(255,180,171,0.4); color: var(--error); }

    .dot {
      width: 6px; height: 6px;
      background: currentColor; border-radius: 50%;
      position: relative;
    }
    .dot.pulse::after {
      content: '';
      position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-radius: 50%; background: currentColor;
      opacity: 0;
      animation: ping 2s cubic-bezier(0,0,0.2,1) infinite;
    }
    @keyframes ping { 75%,100% { transform: scale(2); opacity: 0; } }

    /* ── Metrics bar ────────────────────────────────── */
    .metrics-bar {
      display: flex; gap: 1px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .metric {
      flex: 1;
      padding: 10px 0;
      text-align: center;
    }
    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px; font-weight: 600;
      color: var(--primary);
    }
    .metric-value.green { color: var(--secondary); }
    .metric-label {
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--outline);
      margin-top: 2px;
    }

    /* ── Main ───────────────────────────────────────── */
    .main { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

    /* ── Input ──────────────────────────────────────── */
    .input-box {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px;
      transition: all 0.3s ease;
    }
    .input-box:focus-within { border-color: rgba(0,191,255,0.5); box-shadow: 0 0 15px rgba(0,191,255,0.1); }
    .input-field {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--on-surface); font-family: 'Inter',sans-serif;
      font-size: 15px; line-height: 1.5; resize: none;
    }
    .input-field::placeholder { color: rgba(229,226,225,0.35); }
    .input-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

    .btn-start {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: var(--primary-container); color: var(--on-primary);
      border: none; border-radius: 9999px;
      font-family: 'Inter',sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-start:hover { box-shadow: 0 0 20px rgba(0,191,255,0.3); transform: translateY(-1px); }
    .btn-start:active { transform: translateY(0); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-start .material-icons { font-size: 18px; }

    /* ── Suggestions ────────────────────────────────── */
    .section-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--on-surface-variant); margin-bottom: 6px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: rgba(28,27,27,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      font-size: 13px; font-weight: 500;
      color: var(--on-surface);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover { border-color: rgba(0,191,255,0.4); transform: translateY(-1px); }
    .chip .material-icons { font-size: 16px; color: var(--primary); }

    /* ── Agents list (always visible) ────────────────── */
    .agents-section {
      background: rgba(28,27,27,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px;
    }
    .agent-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0;
    }
    .agent-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.04); }

    .agent-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .agent-dot.active  { background: var(--secondary); box-shadow: 0 0 8px rgba(17,255,160,0.5); }
    .agent-dot.idle    { background: var(--outline); }
    .agent-dot.running { background: var(--primary); box-shadow: 0 0 8px rgba(0,191,255,0.5); animation: blink 1.5s infinite; }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .agent-info { flex: 1; min-width: 0; }
    .agent-name { font-size: 13px; font-weight: 500; }
    .agent-type { font-size: 11px; color: var(--outline); }
    .agent-status-tag {
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 4px;
    }
    .agent-status-tag.active  { background: rgba(17,255,160,0.15); color: var(--secondary); }
    .agent-status-tag.idle    { background: rgba(135,146,155,0.15); color: var(--outline); }
    .agent-status-tag.running { background: rgba(0,191,255,0.15); color: var(--primary); }

    /* ── Logs ───────────────────────────────────────── */
    .logs-section {
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; overflow: hidden;
    }
    .logs-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logs-header .material-icons { font-size: 14px; color: var(--primary); }
    .logs-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--on-surface-variant);
    }
    .logs-count {
      margin-left: auto;
      font-size: 10px; color: var(--outline);
      font-family: 'JetBrains Mono', monospace;
    }
    .logs-body {
      padding: 10px 14px;
      max-height: 150px; overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; line-height: 1.6;
    }
    .logs-body::-webkit-scrollbar { width: 4px; }
    .logs-body::-webkit-scrollbar-track { background: transparent; }
    .logs-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .log-line {
      display: flex; align-items: flex-start; gap: 8px;
      margin-bottom: 6px;
      opacity: 0; animation: fadeIn 0.3s ease forwards;
    }
    .log-line:last-child { margin-bottom: 0; }
    @keyframes fadeIn { to { opacity: 1; } }
    .log-ts { color: rgba(255,255,255,0.25); white-space: nowrap; flex-shrink: 0; }
    .log-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .log-dot.info    { background: var(--primary); }
    .log-dot.success { background: var(--secondary); }
    .log-dot.error   { background: var(--error); }
    .log-dot.warning { background: var(--tertiary); }
    .log-msg { color: rgba(229,226,225,0.65); word-break: break-word; }

    .logs-empty {
      padding: 20px; text-align: center;
      font-size: 12px; color: var(--outline);
    }

    /* ── Footer ─────────────────────────────────────── */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(19,19,19,0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      position: sticky; bottom: 0;
    }
    .footer-left { display: flex; align-items: center; gap: 6px; }
    .footer-status {
      font-size: 11px; color: var(--outline);
      display: flex; align-items: center; gap: 4px;
    }
    .footer-status .material-icons { font-size: 14px; }
    .footer-status.ok  { color: var(--secondary); }
    .footer-status.err { color: var(--error); }

    .footer-right { display: flex; align-items: center; gap: 8px; }

    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: var(--outline); padding: 4px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; transition: all 0.2s ease;
    }
    .btn-icon:hover { color: var(--on-surface); background: rgba(255,255,255,0.06); }
    .btn-icon .material-icons { font-size: 18px; }

    .btn-sm {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 9999px;
      color: var(--on-surface);
      font-family: 'Inter',sans-serif; font-size: 11px; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.25); }
    .btn-sm.danger:hover { border-color: rgba(255,180,171,0.5); color: var(--error); }
    .btn-sm .material-icons { font-size: 14px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .breathing { animation: breathe 2s ease-in-out infinite; }
  </style>
</head>

<body>
  <div class="ext">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="36" height="36" rx="8" stroke="url(#g)" stroke-width="2" fill="none"/>
          <path d="M20 10L28 26H12L20 10Z" stroke="var(--primary-container)" stroke-width="1.5" fill="none"/>
          <circle cx="20" cy="20" r="2" fill="var(--primary)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="40" y2="40">
            <stop offset="0%" stop-color="var(--secondary)"/>
            <stop offset="100%" stop-color="var(--primary-container)"/>
          </linearGradient></defs>
        </svg>
        <span class="brand">AMABA</span>
      </div>
      <div id="badge" class="badge ready">
        <span id="badge-dot" class="dot pulse"></span>
        <span id="badge-text">READY</span>
      </div>
    </header>

    <!-- Live Metrics Bar -->
    <div id="metrics-bar" class="metrics-bar">
      <div class="metric">
        <div class="metric-value green" id="m-agents">—</div>
        <div class="metric-label">Agents</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="m-tasks">—</div>
        <div class="metric-label">Tasks Done</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="m-latency">—</div>
        <div class="metric-label">Latency</div>
      </div>
      <div class="metric">
        <div class="metric-value green" id="m-reliability">—</div>
        <div class="metric-label">Uptime</div>
      </div>
    </div>

    <main class="main">

      <!-- Input -->
      <section>
        <div class="input-box">
          <textarea id="input-field" class="input-field" rows="2"
            placeholder="What should AMABA do?"></textarea>
          <div class="input-actions">
            <button id="start-btn" class="btn-start">
              <span class="material-icons">play_arrow</span>
              Start Automation
            </button>
          </div>
        </div>
      </section>

      <!-- Suggestions -->
      <section>
        <div class="section-label">Suggested Actions</div>
        <div class="chips">
          <div class="chip" data-text="Research competitors">
            <span class="material-icons">search</span> Research competitors
          </div>
          <div class="chip" data-text="Compare products">
            <span class="material-icons">compare_arrows</span> Compare products
          </div>
          <div class="chip" data-text="Fill form">
            <span class="material-icons">description</span> Fill form
          </div>
        </div>
      </section>

      <!-- Agents (live from backend) -->
      <section>
        <div class="section-label">Agents</div>
        <div class="agents-section" id="agents-list">
          <div class="logs-empty">Connecting to backend...</div>
        </div>
      </section>

      <!-- Live Logs -->
      <section class="logs-section">
        <div class="logs-header">
          <span class="material-icons">terminal</span>
          <span class="logs-title">Live Logs</span>
          <span class="logs-count" id="logs-count">0 entries</span>
        </div>
        <div class="logs-body" id="logs-body">
          <div class="logs-empty">Fetching logs...</div>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <div class="footer-status" id="conn-status">
          <span class="material-icons breathing">cloud_off</span>
          <span id="conn-text">Connecting...</span>
        </div>
      </div>
      <div class="footer-right">
        <button class="btn-sm" id="pause-btn">
          <span class="material-icons">pause</span> Pause
        </button>
        <button class="btn-sm danger" id="abort-btn">
          <span class="material-icons">stop</span> Abort
        </button>
        <button class="btn-icon" id="refresh-btn" title="Refresh">
          <span class="material-icons">refresh</span>
        </button>
        <button class="btn-icon" id="settings-btn" title="Settings">
          <span class="material-icons">settings</span>
        </button>
      </div>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
